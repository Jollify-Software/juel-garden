<html>
    <head>
        <meta charset="utf-8"/>
        <script src="../../dist/juel-garden.js"></script>
        <style>
            #hud {
                position: absolute; top: 12px; left: 12px; z-index: 1;
                font: 16px sans-serif; color: white;
            }
            #hud button { font-size: 16px; padding: 6px 14px; }
        </style>
    </head>
    <body>
        <div id="hud">
            <button onclick="blast.fire()">Explosion</button>
            <button onclick="lift.fire()">Updraft</button>
            <button onclick="dummy.limp()">Knock over</button>
            <span id="status">Point at the wall: a raycast finds the brick under the pointer.</span>
        </div>

        <garden-scene>
            <!--
              JOINTS, FORCES, A WALL OF BRICKS AND A RAGDOLL

              A gate swings on a hinge, a ball hangs on a rope, a wheel turns on a motor,
              and a wall of 120 bricks (one mesh, each brick its own body) waits for the
              explosion. The small camera in the corner looks down from above. "Knock over"
              lets the mannequin fall as a ragdoll.
            -->
            <garden-physics></garden-physics>
            <garden-camera id="cam" type="arc" position="0 6 -18"></garden-camera>
            <garden-camera type="free" position="0 25 0" rotation="90 0 0" viewport="0.75 0.7 0.25 0.3"></garden-camera>
            <garden-light></garden-light>
            <garden-light type="directional" direction="-1 -2 1" position="10 20 -10" intensity="0.6"></garden-light>
            <garden-environment sky="false" ground="false"></garden-environment>
            <garden-ground width="40" height="40" colour="#7a8c6e" physics="static"></garden-ground>

            <!-- A gate on a hinge: it swings about the post's edge, at most 90 degrees each way. -->
            <garden-box id="post" physics="static" width="0.3" height="2.4" depth="0.3" position="-8 1.2 -2" colour="#6b4f3a"></garden-box>
            <garden-box id="gate" physics width="2" height="1.6" depth="0.1" position="-6.85 1.2 -2" colour="#c8a46e"></garden-box>
            <garden-joint type="hinge" between="#post #gate" pivot-a="0.15 0 0" pivot-b="-1 0 0" axis-a="0 1 0" limits="angular-x -1.57 1.57"></garden-joint>

            <!-- A ball on a 3 m rope from a beam. -->
            <garden-box id="beam" physics="static" width="0.3" height="0.3" depth="3" position="-3 5 -2" colour="#6b4f3a"></garden-box>
            <garden-sphere id="ball" physics diameter="0.8" position="-1 4 -2" colour="#d94f3a"></garden-sphere>
            <garden-joint type="distance" between="#beam #ball" min-distance="0" max-distance="3"></garden-joint>

            <!-- A wheel on a motor. -->
            <garden-box id="axle" physics="static" size="0.4" position="2 2 -2" colour="#555555"></garden-box>
            <garden-cylinder id="wheel" physics diameter="3" height="0.2" position="2 2 -2.5" rotation="90 0 0" colour="#3a6fd9"></garden-cylinder>
            <garden-joint type="hinge" between="#axle #wheel" pivot-a="0 0 -0.5" axis-a="0 0 1" axis-b="0 1 0" motor="1.5"></garden-joint>

            <!-- A wall of 12 x 5 x 2 bricks, and the forces that knock it down. -->
            <garden-box id="bricks" width="0.9" height="0.45" depth="0.45" position="-5.5 0.225 4" grid="12 5 2" grid-spacing="1 0.45 0.5"
                instance-colours="#a0522d #b5653a #8f4a2a #c06a40 #9a5a35" physics mass="0.5"></garden-box>
            <garden-force id="blast" type="explosion" position="0 1 3" radius="6" strength="4" falloff="linear" show></garden-force>
            <garden-force id="lift" type="updraft" position="-3 0 4" radius="3" strength="4" height="8" duration="2000" show></garden-force>

            <!-- A ragdoll: physics boxes ride the mannequin's bones until it's knocked over. -->
            <garden-mesh-model src="../assets/characters/Mannequin.glb" play="Idle_Loop" position="7 0 -2" rotation="0 180 0">
                <garden-ragdoll id="dummy">
                    <garden-ragdoll-bone bones="root" size="0.05"></garden-ragdoll-bone>
                    <garden-ragdoll-bone bones="pelvis" size="0.25"></garden-ragdoll-bone>
                    <garden-ragdoll-bone bones="spine_03" size="0.25" box-offset="0.05" rotation-axis="0 0 1" min="-1" max="1"></garden-ragdoll-bone>
                    <garden-ragdoll-bone bones="upperarm_l upperarm_r" width="0.1" height="0.25" depth="0.1" box-offset="0.12" rotation-axis="0 1 0" min="-1" max="1"></garden-ragdoll-bone>
                    <garden-ragdoll-bone bones="thigh_l thigh_r" width="0.12" height="0.4" depth="0.12" box-offset="0.2" rotation-axis="0 1 0" min="-1" max="1"></garden-ragdoll-bone>
                    <garden-ragdoll-bone bones="calf_l calf_r" width="0.1" height="0.4" depth="0.1" box-offset="0.2" rotation-axis="0 1 0" min="-1" max="1"></garden-ragdoll-bone>
                    <garden-ragdoll-bone bones="Head" size="0.25" box-offset="0.1" joint="ball"></garden-ragdoll-bone>
                </garden-ragdoll>
            </garden-mesh-model>

            <!-- Where the pointer's ray meets something. -->
            <garden-sphere id="marker" diameter="0.3" position="0 -10 0"><garden-material emissive-colour="#00ff00"></garden-material></garden-sphere>
        </garden-scene>
        <script>
            const sceneEl = document.querySelector("garden-scene"), physics = document.querySelector("garden-physics");
            const marker = document.getElementById("marker"), status = document.getElementById("status");
            sceneEl.addEventListener("pointermove", () => {
                const scene = sceneEl.scene, camera = document.getElementById("cam").camera;
                if (!scene || !camera) return;
                const ray = scene.createPickingRay(scene.pointerX, scene.pointerY, null, camera);
                const hit = physics.raycast(ray.origin, ray.origin.add(ray.direction.scale(100)));
                if (!hit) return;
                marker.mesh.position.copyFrom(hit.point);
                status.textContent = hit.element?.id == "bricks" ? `Brick ${hit.instance}` : (hit.element?.id || hit.element?.localName || "");
            });
        </script>
    </body>
</html>
