<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
</head>

<body>
    <garden-scene gravity="0 -0.4 0" collisions>
        <!-- A primitive round hut: a low daubed drum under a steep thatch cone
             with a slight eave overhang. Camera outside and slightly above. -->
        <garden-camera type="free" collisions position="0 9 -32"></garden-camera>
        <garden-light></garden-light>
        <garden-webxr></garden-webxr>

        <garden-structure collisions>
            <!-- type="rotunda": a circular floor + one swept wall. slot="wall"
                 textures the drum; slot="floor" the floor. -->
            <garden-room id="drum" type="rotunda" width="16" height="5" collisions>
                <garden-material slot="floor" colour="#8a7d63">
                    <garden-texture src="https://assets.babylonjs.com/textures/floor.png"></garden-texture>
                </garden-material>
                <garden-material slot="wall" colour="#a68a63"></garden-material>
            </garden-room>

            <!-- An apex/thatch roof: `pitch` sets how steep, `overhang` gives it
                 a slight circular eave past the wall. -->
            <garden-roof type="cone" pitch="1.1" overhang="0.8" colour="#7a5a38" spec-colour="0 0 0"></garden-roof>

            <!-- depth spans the curved wall's thickness across the doorway width
                 (a thinner cutter only punches through at the very centre). -->
            <garden-opening between="#drum" position="0 1.6 -8" width="3.4" height="3.6" depth="1"></garden-opening>
        </garden-structure>

        <garden-ground width="120" height="120" position="0 -0.1 0" collisions></garden-ground>

        <!-- The whole campsite in one <garden-element parent> group: move it with
             a single `position`. Everything inside is authored relative to the
             group origin (the fire pit). `parent` re-parents each child mesh into
             the group's node; <garden-particle effect="fire"> now reads its
             parent's *world* position so it lands right inside a group too. -->
        <garden-element parent position="-4 0 -11" id="campsite">
            <!-- fire pit: stone ring, three logs, and a low anchor for the flames -->
            <garden-torus diameter="2.4" thickness="0.5" colour="#4a4640"></garden-torus>
            <garden-cylinder position="0 0.28 0" diameter="0.32" height="2" rotation="0 25 90" colour="#5b3a29"></garden-cylinder>
            <garden-cylinder position="0 0.32 0" diameter="0.32" height="2" rotation="0 -35 90" colour="#6b4a34"></garden-cylinder>
            <garden-cylinder position="0 0.24 0" diameter="0.32" height="2" rotation="0 80 90" colour="#4a3020"></garden-cylinder>
            <garden-cylinder position="0 0 0" diameter="0.7" height="0.5" colour="#2a2018">
                <garden-particle effect="fire"></garden-particle>
            </garden-cylinder>

            <!-- a roasting spit set up opposite the fire: two uprights, a skewer
                 bar between them, two fish hung from it by a short line -->
            <garden-cylinder position="-2.2 0.8 -1" diameter="0.14" height="1.7" colour="#3a2a1a"></garden-cylinder>
            <garden-cylinder position="-2.2 0.8 1" diameter="0.14" height="1.7" colour="#3a2a1a"></garden-cylinder>
            <garden-cylinder position="-2.2 1.5 0" diameter="0.1" height="2.6" rotation="90 0 0" colour="#5a4028"></garden-cylinder>
            <garden-cylinder position="-2.2 1.35 -0.45" diameter="0.03" height="0.32" colour="#5a4a2a"></garden-cylinder>
            <garden-cylinder position="-2.2 1.35 0.45" diameter="0.03" height="0.32" colour="#5a4a2a"></garden-cylinder>
            <garden-sphere position="-2.2 1 -0.45" diameter="0.5" scale="0.35 1.8 0.8" colour="#9aa7ad"></garden-sphere>
            <garden-sphere position="-2.2 1 0.45" diameter="0.5" scale="0.35 1.8 0.8" colour="#8f9ea6"></garden-sphere>
        </garden-element>
        <!-- the fire's glow -- a plain PointLight, so it isn't part of the group;
             nudge it with the group if you move the campsite -->
        <garden-light type="point" position="-4 1.2 -11" diffuse="0.7 0.42 0.2"></garden-light>
    </garden-scene>
</body>

</html>
