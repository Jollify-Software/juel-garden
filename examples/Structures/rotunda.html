<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
</head>

<body>
    <garden-scene gravity="0 -0.4 0" collisions>
        <!-- A 16-unit-wide rotunda, 8 tall. Camera outside and slightly above,
             looking at the domed drum. -->
        <garden-camera type="free" collisions position="0 6 -24"></garden-camera>
        <garden-light></garden-light>
        <garden-webxr></garden-webxr>

        <garden-structure collisions>
            <!-- type="rotunda": a circular floor + one swept wall. slot="wall"
                 textures the drum; slot="floor" the floor. -->
            <garden-room id="drum" type="rotunda" width="16" height="8" collisions>
                <garden-material slot="floor" colour="#b8ad98">
                    <garden-texture src="https://assets.babylonjs.com/textures/floor.png"></garden-texture>
                </garden-material>
                <garden-material slot="wall" colour="#ece7db"></garden-material>
            </garden-room>

            <!-- A dome over the whole structure (sized to the rotunda's footprint). -->
            <garden-roof type="dome" outside-colour="#c9bfa8" inside-colour="#f4efe4"></garden-roof>

            <!-- depth spans the curved wall's thickness across the doorway width
                 (a thinner cutter only punches through at the very centre). -->
            <garden-opening between="#drum" position="0 2 -8" width="4" height="5" depth="1"></garden-opening>
        </garden-structure>

        <garden-ground width="120" height="120" position="0 -0.1 0" collisions></garden-ground>

        <!-- A campfire out in front of the entrance and off to one side of it
             (the doorway faces -z; this sits at -x, a few units further out).
             <garden-particle effect="fire"> emits from its parent mesh's
             world position raised by that parent's `height`, so the low anchor
             cylinder puts the flames just above the logs. -->
        <garden-torus position="-4 0 -11" diameter="2.4" thickness="0.5" colour="#4a4640"></garden-torus>
        <garden-cylinder position="-4 0.28 -11" diameter="0.32" height="2" rotation="0 25 90" colour="#5b3a29"></garden-cylinder>
        <garden-cylinder position="-4 0.32 -11" diameter="0.32" height="2" rotation="0 -35 90" colour="#6b4a34"></garden-cylinder>
        <garden-cylinder position="-4 0.24 -11" diameter="0.32" height="2" rotation="0 80 90" colour="#4a3020"></garden-cylinder>
        <garden-cylinder id="campfire" position="-4 0 -11" diameter="0.7" height="0.5" colour="#2a2018">
            <garden-particle effect="fire"></garden-particle>
        </garden-cylinder>
        <garden-light type="point" position="-4 1.4 -11" diffuse="1 0.6 0.3"></garden-light>
    </garden-scene>
</body>

</html>
