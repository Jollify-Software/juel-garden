<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
</head>

<body>
    <garden-scene gravity="0 -0.4 0" collisions>
        <!-- The gallery spans roughly x=-14..14, z=-10..16. A free camera on the
             south side, lifted to eye height and pulled back, frames the apsidal
             (curved) north wall and the standalone screen wall in front of it. -->
        <garden-camera type="arc" position="0 26 -34" target="0 2 3"></garden-camera>
        <garden-light></garden-light>
        <garden-webxr></garden-webxr>

        <garden-structure collisions>
            <!-- Three straight sides + a curved north wall bowed 4 units outward:
                 an apsidal gallery end. The floor follows the bowed wall. -->
            <garden-room id="gallery" width="24" depth="18" height="6" collisions>
                <garden-wall slot="north" curve="4" segments="24"></garden-wall>
            </garden-room>

            <!-- A free-standing curved screen wall inside the room (a partition
                 you walk around). Lower than the room so the apse stays visible
                 behind it. Fully inside the room -> no doorway cut. -->
            <garden-wall points="-7 0 -2, 7 0 -2" curve="-3" segments="24"
                height="3" thickness="0.3" colour="#c7bda8" collisions></garden-wall>

            <!-- A curved entrance wall running in from the west: it crosses the
                 gallery's west wall, and <garden-structure> auto-cuts the doorway
                 there (tryWallCrossing) -- no hand-placed <garden-opening> needed. -->
            <garden-wall points="-24 0 -6, -10 0 -6" curve="2.5" segments="24"
                height="5" thickness="0.4" collisions></garden-wall>

            <!-- The south doorway isn't on a piercing wall, so it's still a
                 hand-placed opening. -->
            <garden-opening between="#gallery" position="0 1.5 -9" width="4" height="4"></garden-opening>
        </garden-structure>

        <garden-ground width="120" height="120" position="0 -0.1 0" collisions></garden-ground>
    </garden-scene>
</body>

</html>
