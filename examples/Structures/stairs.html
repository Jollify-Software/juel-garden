<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
</head>

<body>
    <garden-scene>
        <!-- The three staircases plus the box span roughly z=-30 to z=25 --
             the default radius-3 camera used to show almost nothing but empty
             space around the origin. Pulled back far enough to see the whole
             spread-out layout at once. -->
        <garden-camera position="45 30 -12">
        </garden-camera>
        <garden-light></garden-light>

        <garden-box size="10" position="0 2 5"></garden-box>

        <!-- Textured: the stairs carry real uvs (in metres, so the texture tiles). -->
        <garden-stairs id="straight" position="0 0 -20" height="5" depth="20">
            <garden-material>
                <garden-texture src="https://assets.babylonjs.com/textures/floor.png"></garden-texture>
            </garden-material>
        </garden-stairs>

        <garden-stairs id="curved" height="5" depth="20" curvature="90" position="0 0 15"></garden-stairs>

        <garden-stairs radius="5" position="0 0 15"></garden-stairs>
            
    </garden-scene>
</body>

</html>
