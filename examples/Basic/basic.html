<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
    <style id="garden-styles">
        garden-box {
            colour: #4CC3D9;
        }
        garden-sphere {
            colour: #EF2D5E;
        }
        garden-cylinder {
            colour: #FFC65D;
        }
    </style>
</head>

<body>
    <garden-scene>
    <!-- The default arc camera starts at radius 3 around the origin -- much too
         close to actually see this group, which sits a few units out at
         roughly x=0, y=-0.5, z=-4 (see the parent's -1.5 y-offset below). An
         explicit starting position frames the whole group on load instead of
         requiring a manual scroll-out. -->
    <garden-camera position="0 1 4"></garden-camera>
    <garden-light></garden-light>
    
    <garden-element parent position="0 -1.5 0">
        <garden-box position="-1 0.5 -3" rotation="0 45 0"></garden-box>
        <garden-sphere position="0 1.25 -5" diameter="2.50"></garden-sphere>
        <garden-cylinder position="1 0.75 -3" diameter="1" height="1.5"></garden-cylinder>
        <garden-ground position="0 0 -4" width="4" height="4" colour="#7BC8A4"></garden-ground>
    </garden-element>
</garden-scene>
</body>

</html>
