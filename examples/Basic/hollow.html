<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
</head>

<body>
    <garden-scene>
        <!-- The default camera (radius 3, target the origin) only ever framed
             the cylinder sitting at the origin -- the split sphere 5 units out
             in -z was completely out of view. Pulled back along the same axis
             so both are visible together. -->
        <garden-camera position="0 1 -13">
        </garden-camera>
        <garden-light></garden-light>

        <garden-sphere position="0 1.25 -5" diameter="2.50" colour="#EF2D5E" split></garden-sphere>
        <garden-cylinder diameter="1" height="1.5" colour="#FFC65D" hollow=".75 1 .75"></garden-cylinder>

    </garden-scene>
</body>

</html>
