<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
</head>

<body>
    <garden-scene>
        <garden-camera position="0 0 -16">
        </garden-camera>
        <garden-light></garden-light>

        <!-- Free-floating in-world text: draws onto its own plane via garden-canvas.
             For a screen-space label attached to a mesh, see examples/Gui/info-panel.html. -->
        <garden-canvas width="14" height="5" subdivisions="1" canvas="700 250"
            font="bold 32px monospace" background="white" foreground="black">
            The Sun is a nearly perfect
            sphere of hot plasma, and by
            far our most important
            source of energy on Earth.
        </garden-canvas>
    </garden-scene>
</body>

</html>
