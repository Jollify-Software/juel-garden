<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
</head>

<body>
    <garden-scene>
        <!-- The default camera (radius 3) starts almost inside this 20x10
             ground plane -- pulled back to actually see the rasterised text
             on its surface. -->
        <garden-camera radius="18">
        </garden-camera>
        <garden-light></garden-light>


        <garden-ground width="20" height="10" texture="html">
            <h2>Hello there!!</h2>
        </garden-ground>


    </garden-scene>
</body>

</html>
