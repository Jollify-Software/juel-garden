<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8"/>
    <script src="../../dist/juel-garden.js"></script>
</head>

<body>
    <garden-scene>
        <!-- Default arc camera (radius 3) barely clears this sphere's own
             radius (1.25) -- pulled back a little for breathing room. -->
        <garden-camera radius="4"></garden-camera>
        <garden-light></garden-light>

        <garden-sphere diameter="2.50">
            <garden-canvas content="svg" background="red">
                <svg version="1.1" width="300" height="200" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100%" height="100%" fill="red" />
                    <circle cx="150" cy="100" r="80" fill="green" />
                    <text x="150" y="125" font-size="60" text-anchor="middle" fill="white">SVG</text>
                </svg>
            </garden-canvas>
        </garden-sphere>
    </garden-scene>
</body>

</html>
