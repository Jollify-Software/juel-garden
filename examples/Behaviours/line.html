<html>
    <head>
        <meta charset="utf-8"/>
        <script src="../../dist/juel-garden.js"></script>
    </head>
    <body>
        <garden-scene>
            <!-- The 4x4 track loop's diagonal (~2.8) barely fit the default
                 radius-3 camera -- pulled back a bit for a full, uncropped
                 view of the loop as the sphere tracks around it. -->
            <garden-camera radius="6"></garden-camera>
            <garden-light></garden-light>

            <garden-line points="2 0 2, 2 0 -2, -2 0 -2, 2 0 2">
                <garden-sphere position="2 0 2" diameter="0.25" track track-step="0.005"></garden-sphere>
            </garden-line>
            

          </garden-scene>
    </body>
</html>
