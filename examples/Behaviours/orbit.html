<html>
    <head>
        <meta charset="utf-8"/>
        <script src="../../dist/juel-garden.js"></script>
    </head>
    <body>
        <garden-scene>
            <!-- BehaviourOrbit reads this position ("2 0 8") as world-space (the
                 outer sphere has no `parent` attribute, so it's never actually
                 reparented under it before orbiting) -- so the orbiting sphere
                 sweeps a full circle of radius ~8.25 around the origin, and at
                 its own radius (5.125) the swept envelope reaches out to
                 roughly 13.4 units. The default radius-3 camera used to start
                 almost inside the central sphere (radius 2.625) with the
                 orbiting one entirely out of frame most of the time. -->
            <garden-camera radius="38"></garden-camera>
            <garden-light></garden-light>

            <garden-sphere diameter="5.25">
                <garden-sphere position="2 0 8" diameter="10.25" orbit orbit-angle="0.005"></garden-sphere>
            </garden-sphere>
            

          </garden-scene>
    </body>
</html>
