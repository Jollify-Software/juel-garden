<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="../../dist/juel-garden.js"></script>
        <style>
            #hud { position: absolute; top: 12px; left: 12px; z-index: 1; font: 15px sans-serif; color: white;
                   text-shadow: 0 1px 2px black; }
            #hud button { font-size: 15px; padding: 4px 12px; }
        </style>
    </head>
    <body>
        <div id="hud"><button id="grow">Bigger light</button> <button id="shrink">Smaller light</button>
            Walk with WASD / arrows; stay in the light.</div>

        <garden-scene>
            <!--
              CARRIED LIGHT

              Night, with only a faint blue sky light. The guide carries a
              `pool` of warm light: a <garden-light> inside the guide's
              <garden-mesh-model> hangs on it (at `position` above its head)
              and shines straight down, opened so its circle on the ground is
              `pool` metres across. The buttons set `pool` from code.

              The lantern on the post flickers: a <garden-animation
              property="intensity"> inside its light.
            -->
            <garden-camera type="follow" target="#player" free-look radius="8" height-offset="5" look-offset="1"
                camera-stiffness="20" camera-damping="7"></garden-camera>
            <garden-light intensity="0.12" diffuse="0.4 0.5 0.9"></garden-light>
            <garden-ground width="80" height="80" colour="#b49a6a"></garden-ground>

            <garden-line points="-10 0 -10, 10 0 -10, 10 0 10, -10 0 10, -10 0 -10">
                <garden-mesh-model id="guide" src="../assets/characters/RobotExpressive.glb" height="1.9" loading-screen="false"
                    anim-idle="Idle" anim-walk="Walking" anim-walk-speed="1.5"
                    track track-smooth="8" track-step="0.02" follow-wait="#player" follow-wait-distance="7">
                    <garden-light id="pool" pool="7" position="0 3 0" intensity="1.6" diffuse="1 0.78 0.45"></garden-light>
                </garden-mesh-model>
            </garden-line>

            <garden-cylinder diameter="0.15" height="2.4" position="0 1.2 0" colour="#3a3a3a">
                <garden-sphere diameter="0.35" position="0 1.3 0" colour="#ffd27a" emissive-colour="#ffb347"></garden-sphere>
                <garden-light type="point" position="0 1.3 0" range="9" diffuse="1 0.7 0.35">
                    <garden-animation event="load" property="intensity" type="float" loop="true" from="0" to="40"
                        keyframes="0 1, 6 0.7, 11 1.1, 19 0.8, 27 1.05, 33 0.75, 40 1"></garden-animation>
                </garden-light>
            </garden-cylinder>

            <garden-cylinder id="player" diameter="0.5" height="1.2" position="-10 0.6 -14" colour="#3c78d8"
                walk walk-speed="2.5" walk-run-speed="6"></garden-cylinder>
        </garden-scene>

        <script>
            const pool = document.getElementById("pool");
            document.getElementById("grow").onclick = () => pool.pool = Math.min(16, pool.pool + 2);
            document.getElementById("shrink").onclick = () => pool.pool = Math.max(2, pool.pool - 2);
        </script>
    </body>
</html>
