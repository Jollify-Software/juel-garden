<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="../../dist/juel-garden.js"></script>
        <style>
            #hud { position: absolute; top: 12px; left: 12px; z-index: 1; font: 15px sans-serif; color: white;
                   text-shadow: 0 1px 2px black; }
        </style>
    </head>
    <body>
        <div id="hud">Walk with WASD / arrows (Shift runs). Fall behind and the guide waits. <b id="status"></b></div>

        <garden-scene>
            <!--
              FOLLOW

              The guide (the robot) walks a loop on a `track`. Three foxes
              `follow` it, keeping `follow-spacing` apart so they trail in a
              loose group rather than piling up. You are the blue capsule.

              `follow-wait="#player"` on the guide: when you are more than
              10 m behind, the guide stops, turns to face you and fires
              `garden-wait`; walk back within 8 m and it carries on
              (`garden-resume`). The foxes stop with it, because they only
              ever head for the guide.
            -->
            <garden-camera type="follow" target="#player" free-look radius="9" height-offset="5" look-offset="1"
                camera-stiffness="20" camera-damping="7"></garden-camera>
            <garden-light diffuse="1 0.95 0.85"></garden-light>
            <garden-ground width="80" height="80" colour="#b8a271"></garden-ground>

            <garden-line points="-12 0 -12, 12 0 -12, 12 0 12, -12 0 12, -12 0 -12" colour="#8f7b4f">
                <garden-mesh-model id="guide" src="../assets/characters/RobotExpressive.glb" height="1.9"
                    animation="Walking" loading-screen="false"
                    track track-smooth="8" track-step="0.025"
                    follow-wait="#player" follow-wait-distance="10"></garden-mesh-model>
            </garden-line>

            <garden-mesh-model class="fox" src="../assets/characters/Fox.glb" height="0.7" animation="Walk"
                position="-14 0 -16" loading-screen="false" follow="#guide" follow-distance="2.5" follow-spacing="1.6"></garden-mesh-model>
            <garden-mesh-model class="fox" src="../assets/characters/Fox.glb" height="0.6" animation="Walk"
                position="-16 0 -14" loading-screen="false" follow="#guide" follow-distance="2.5" follow-spacing="1.6"></garden-mesh-model>
            <garden-mesh-model class="fox" src="../assets/characters/Fox.glb" height="0.65" animation="Walk"
                position="-15 0 -18" loading-screen="false" follow="#guide" follow-offset="-1.6 0 -2.5" follow-spacing="1.6"></garden-mesh-model>

            <garden-cylinder id="player" diameter="0.6" height="1.3" position="-14 0.65 -20" colour="#3c78d8"
                walk walk-speed="2.5" walk-run-speed="6"></garden-cylinder>
        </garden-scene>

        <script>
            const status = document.getElementById("status");
            const guide = document.getElementById("guide");
            guide.addEventListener("garden-wait", e => status.textContent = `The guide is waiting for you (${e.detail.distance.toFixed(0)} m).`);
            guide.addEventListener("garden-resume", () => status.textContent = "");
        </script>
    </body>
</html>
