name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# The physics test (npm run test:physics) needs a real GPU, so it stays a
# local run; CI only builds.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          npm run build
          test -s dist/decoders/draco_decoder_gltf.wasm
          test -s dist/juel-garden.js
